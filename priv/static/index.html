<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <meta name="color-scheme" content="light">
  <title>Cantrip — Rastreador de magias 5e</title>
  <meta name="description" content="Acompanhe slots de magia e magias 'em mãos' para D&D 5e.">
  <meta name="author" content="Matheus (matheusdmm.dev)">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%237c3aed%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27central%27%20font-family%3D%27system-ui%2CArial%27%20font-size%3D%2720%27%20font-weight%3D%27700%27%20fill%3D%27%23ffffff%27%3EC%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%237c3aed%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27central%27%20font-family%3D%27system-ui%2CArial%27%20font-size%3D%2720%27%20font-weight%3D%27700%27%20fill%3D%27%23ffffff%27%3EC%3C%2Ftext%3E%3C%2Fsvg%3E">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cantrip">
  <meta property="og:title" content="Cantrip — Rastreador de magias 5e">
  <meta property="og:description" content="Acompanhe slots de magia e magias 'em mãos' para D&D 5e.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Cantrip — Rastreador de magias 5e">
  <meta name="twitter:description" content="Acompanhe slots de magia e magias 'em mãos' para D&D 5e.">

  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --surface-2: #f1f1f3;
      --border: #e4e4e9;
      --text: #18181b;
      --muted: #6b7280;
      --muted-2: #9ca3af;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-soft: #ede9fe;
      --accent-dim: #c4b5fd;
      --danger: #dc2626;
      --radius: 10px;
      --radius-sm: 6px;
      --transition: 120ms ease;
      --tap: 44px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    [x-cloak] { display: none !important; }

    /* ----- mobile-first base ----- */
    .app {
      padding: 0 12px env(safe-area-inset-bottom) 12px;
    }

    /* Sticky control header */
    .sticky {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      margin: 0 -12px;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 10px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 8px;
    }
    .control-row select,
    .control-row input[type="number"],
    .control-row button {
      height: var(--tap);
    }
    .control-row .full { grid-column: 1 / -1; }

    .rest-row {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }
    .rest-row button { flex: 1; height: 40px; }
    .rest-tablet { display: none; }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    select, input[type="number"], input[type="text"], input[type="search"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: inherit;
      width: 100%;
      transition: border-color var(--transition);
      -webkit-appearance: none;
      appearance: none;
    }
    select {
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 32px;
    }
    input[type="number"] { text-align: center; }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      min-height: 40px;
      white-space: nowrap;
    }
    button:active:not(:disabled) { background: var(--surface-2); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 500;
    }
    button.primary:active:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      padding: 0 10px;
      min-height: 36px;
      font-size: 13px;
    }
    button.ghost:active:not(:disabled) { background: var(--surface-2); }

    /* ----- slot grid ----- */
    .slots {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 6px;
    }
    .slot-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 4px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius-sm);
      min-height: var(--tap);
      transition: border-color var(--transition);
    }
    .slot-col.spent {
      background: var(--surface);
      border-color: var(--border);
    }
    .slot-col.has-slots:active { border-color: var(--accent); }
    .slot-col.has-slots { cursor: pointer; }
    .slot-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .slot-pips {
      display: flex; gap: 3px; flex-wrap: wrap; justify-content: center;
      min-height: 8px;
    }
    .pip {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      box-sizing: border-box;
    }
    .pip.spent { background: transparent; border: 1.5px solid var(--muted-2); }
    .slot-count {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--muted);
    }
    .slot-count strong { color: var(--text); font-weight: 600; }

    .no-level {
      padding: 14px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
    }

    /* ----- tabs + filters ----- */
    .tabs {
      display: flex;
      gap: 4px;
      margin: 16px 0 12px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 12px 14px;
      border-radius: 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-weight: 500;
      min-height: 44px;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab .count { color: var(--muted); margin-left: 4px; font-weight: 400; }
    .tabs-actions { margin-left: auto; align-self: center; }

    .filters {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filters input { height: var(--tap); }
    .filters select { height: var(--tap); width: auto; min-width: 110px; }

    /* ----- spell list ----- */
    .spell-list { display: flex; flex-direction: column; gap: 8px; }
    .spell-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      transition: border-color var(--transition), background var(--transition);
    }
    .spell-card.at-hand {
      border-color: var(--accent-dim);
      background: #fbfaff;
    }

    .spell-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .spell-head-text { min-width: 0; flex: 1; }
    .spell-name {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 4px;
      word-wrap: break-word;
    }
    .spell-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }
    .badge {
      display: inline-block;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .badge.level { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }

    .chev {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-2);
      transition: transform var(--transition), color var(--transition);
    }
    .chev::before {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      margin-top: -3px;
    }
    .spell-card.open .chev { transform: rotate(180deg); color: var(--accent); }

    .meta-rows {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
      font-size: 13px;
    }
    .meta-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted-2);
    }
    .meta-value { color: var(--text); overflow-wrap: anywhere; }
    .meta.wide { grid-column: 1 / -1; }

    .description {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      white-space: pre-wrap;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .spell-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .spell-actions button { flex: 1; min-height: var(--tap); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-size: 14px;
    }
    .empty-state strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 15px; }

    /* Bookmark button */
    .bookmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: color var(--transition), background var(--transition), border-color var(--transition);
    }
    .bookmark:active { background: var(--surface-2); }
    .bookmark.on { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
    .bookmark-dot {
      width: 8px; height: 8px; border-radius: 50%;
      border: 1.5px solid currentColor;
      background: transparent;
      box-sizing: border-box;
      transition: background var(--transition);
    }
    .bookmark.on .bookmark-dot { background: var(--accent); border-color: var(--accent); }

    .footer {
      margin-top: 32px;
      padding: 16px 0 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .footer a:hover { text-decoration: underline; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 12px;
      right: 12px;
      max-width: 480px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--danger);
      color: var(--text);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    /* ----- tablet (≥640px) ----- */
    @media (min-width: 640px) {
      .app { padding: 0 20px 80px; }
      .sticky { margin: 0 -20px; padding: 14px 20px 12px; }
      h1 { font-size: 18px; margin-bottom: 14px; }
      .meta-rows { grid-template-columns: repeat(4, 1fr); }
      .meta.wide { grid-column: auto; }
      .control-row { grid-template-columns: 240px 100px auto 1fr; align-items: end; }
      .control-row .rest-tablet { display: flex; justify-content: flex-end; gap: 8px; }
      .rest-row { display: none; }
      .spell-card { padding: 16px 18px; }
      button:hover:not(:disabled) {
        border-color: var(--accent-dim);
        background: var(--accent-soft);
      }
      button.primary:hover:not(:disabled) {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .bookmark:hover { color: var(--text); background: var(--surface-2); }
      .bookmark.on:hover { color: var(--accent); background: var(--accent-soft); }
    }

    /* ----- desktop (≥1024px) ----- */
    @media (min-width: 1024px) {
      .app { max-width: 1024px; margin: 0 auto; padding: 0 32px 96px; }
      .sticky { margin: 0 -32px; padding: 18px 32px 14px; }
      .spell-actions { justify-content: flex-end; }
      .spell-actions button { flex: 0 0 auto; min-width: 110px; }
    }
  </style>
</head>
<body>
<div class="app" x-data="app()" x-init="init()" x-cloak>

  <!-- Sticky top: class selector + level + slots -->
  <div class="sticky">
    <h1>Cantrip</h1>

    <div class="control-row">
      <div>
        <label for="class">Class</label>
        <select id="class" x-model="classSlug" @change="onClassChange()">
          <template x-for="c in classes" :key="c.slug">
            <option :value="c.slug" x-text="c.name"></option>
          </template>
        </select>
      </div>
      <div>
        <label for="lvl">Level</label>
        <input id="lvl" type="number" min="1" max="20" x-model.number="levelInput">
      </div>
      <div>
        <label>&nbsp;</label>
        <button class="primary" @click="setLevel()" :disabled="!classSlug">Set</button>
      </div>
      <div class="rest-tablet" x-show="session.level !== null">
        <button @click="longRest()">Long rest</button>
        <button @click="shortRest()" x-show="classSlug === 'bruxo'">Short rest</button>
      </div>
    </div>

    <div class="rest-row" x-show="session.level !== null">
      <button @click="longRest()">Long rest</button>
      <button @click="shortRest()" x-show="classSlug === 'bruxo'">Short rest</button>
    </div>

    <div x-show="session.level !== null && activeSlots.length > 0">
      <div class="slots">
        <template x-for="col in activeSlots" :key="col.spellLevel">
          <div
            class="slot-col"
            :class="{
              'has-slots': col.remaining > 0,
              'spent': col.remaining === 0
            }"
            @click="col.remaining > 0 && cast(col.spellLevel)"
          >
            <span class="slot-label" x-text="'L' + col.spellLevel"></span>
            <div class="slot-pips">
              <template x-for="n in col.max" :key="n">
                <span class="pip" :class="{ spent: n > col.remaining }"></span>
              </template>
            </div>
            <span class="slot-count">
              <strong x-text="col.remaining"></strong>/<span x-text="col.max"></span>
            </span>
          </div>
        </template>
      </div>
    </div>

    <div class="no-level" x-show="session.level === null">
      Set your caster level to see slots.
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab" :class="tab === 'all' ? 'active' : ''" @click="tab = 'all'">
      Spells <span class="count" x-text="'(' + classSpells.length + ')'"></span>
    </button>
    <button class="tab" :class="tab === 'at-hand' ? 'active' : ''" @click="tab = 'at-hand'">
      At hand <span class="count" x-text="'(' + session.at_hand.length + ')'"></span>
    </button>
    <div class="tabs-actions" x-show="session.at_hand.length > 0">
      <button class="ghost" @click="clearAtHand()">Clear</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <input type="search" placeholder="Search by name…" x-model="search" autocomplete="off">
    <select x-model="levelFilter">
      <option value="">All levels</option>
      <option value="0">Truques</option>
      <option value="1">1º</option>
      <option value="2">2º</option>
      <option value="3">3º</option>
      <option value="4">4º</option>
      <option value="5">5º</option>
      <option value="6">6º</option>
      <option value="7">7º</option>
      <option value="8">8º</option>
      <option value="9">9º</option>
    </select>
  </div>

  <!-- Spell list -->
  <div class="spell-list">
    <template x-for="spell in filteredSpells" :key="spell.slug">
      <div class="spell-card" :class="{ 'at-hand': isAtHand(spell), 'open': expanded[spell.slug] }">
        <div class="spell-head" @click="toggleExpand(spell)">
          <div class="spell-head-text">
            <h3 class="spell-name" x-text="spell.name"></h3>
            <div class="spell-badges">
              <span class="badge level" x-text="spell.level === 0 ? 'Truque' : 'Nv ' + spell.level"></span>
              <span class="badge" x-text="spell.school"></span>
              <span class="badge" x-show="spell.ritual">Ritual</span>
              <span class="badge" x-show="spell.concentration">Concentração</span>
            </div>
          </div>
          <span class="chev"></span>
        </div>

        <div class="meta-rows">
          <div class="meta">
            <span class="meta-label">Tempo</span>
            <span class="meta-value" x-text="spell.casting_time"></span>
          </div>
          <div class="meta">
            <span class="meta-label">Alcance</span>
            <span class="meta-value" x-text="spell.range"></span>
          </div>
          <div class="meta">
            <span class="meta-label">Duração</span>
            <span class="meta-value" x-text="spell.duration"></span>
          </div>
          <div class="meta wide">
            <span class="meta-label">Componentes</span>
            <span class="meta-value" x-text="spell.components"></span>
          </div>
        </div>

        <div class="description" x-show="expanded[spell.slug]" x-text="spell.description"></div>

        <div class="spell-actions">
          <button
            class="bookmark"
            :class="{ on: isAtHand(spell) }"
            @click.stop="toggleAtHand(spell)"
          >
            <span class="bookmark-dot"></span>
            <span x-text="isAtHand(spell) ? 'Saved' : 'Save'"></span>
          </button>
          <button
            class="primary"
            x-show="spell.level > 0"
            @click.stop="cast(spell.level)"
            :disabled="!canCast(spell.level)"
          >
            Cast L<span x-text="spell.level"></span>
          </button>
        </div>
      </div>
    </template>

    <div class="empty-state" x-show="filteredSpells.length === 0">
      <strong x-text="tab === 'at-hand' ? 'Nothing at hand yet' : 'No spells match'"></strong>
      <span x-text="tab === 'at-hand' ? 'Use the Save button on any spell to add it here.' : 'Try adjusting the search or level filter.'"></span>
    </div>
  </div>

  <div class="toast" x-show="toast" x-text="toast" x-transition></div>

  <footer class="footer">
    Cantrip · feito por
    <a href="https://matheusdmm.dev" target="_blank" rel="noopener noreferrer">matheusdmm.dev</a>
  </footer>
</div>

<script>
function app() {
  return {
    classes: [],
    classSpells: [],
    classSlug: 'mago',
    levelInput: 5,
    session: { level: null, max_slots: [0,0,0,0,0,0,0,0,0], slots_remaining: [0,0,0,0,0,0,0,0,0], at_hand: [] },
    tab: 'all',
    search: '',
    levelFilter: '',
    expanded: {},
    toast: '',
    toastTimer: null,

    async init() {
      await this.loadClasses();
      const savedClass = this.storageGet('cantrip.activeClass');
      if (savedClass && this.classes.find(c => c.slug === savedClass)) {
        this.classSlug = savedClass;
      } else if (this.classes.length && !this.classes.find(c => c.slug === this.classSlug)) {
        this.classSlug = this.classes[0].slug;
      }
      await this.onClassChange();
    },

    async onClassChange() {
      this.expanded = {};
      this.storageSet('cantrip.activeClass', this.classSlug);
      await Promise.all([this.loadClassSpells(), this.loadSession()]);
      await this.rehydrate();
      if (this.session.level !== null) this.levelInput = this.session.level;
    },

    async loadClasses() {
      const r = await fetch('/classes');
      this.classes = await r.json();
    },
    async loadClassSpells() {
      const r = await fetch(`/classes/${this.classSlug}/spells`);
      this.classSpells = r.ok ? await r.json() : [];
    },
    async loadSession() {
      const r = await fetch(`/classes/${this.classSlug}/session`);
      this.session = await r.json();
    },

    async setLevel() {
      const r = await fetch(`/classes/${this.classSlug}/session`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ level: this.levelInput }),
      });
      if (!r.ok) { this.flash((await r.json()).error || 'Could not set level'); return; }
      this.session = await r.json();
      this.saveLocal();
    },

    async cast(spellLevel) {
      const r = await fetch(`/classes/${this.classSlug}/cast`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spell_level: spellLevel }),
      });
      if (!r.ok) { this.flash((await r.json()).error || 'Cast failed'); return; }
      this.session = await r.json();
      this.saveLocal();
    },

    async longRest() {
      const r = await fetch(`/classes/${this.classSlug}/long-rest`, { method: 'POST' });
      if (!r.ok) { this.flash((await r.json()).error || 'Long rest failed'); return; }
      this.session = await r.json();
      this.saveLocal();
    },
    async shortRest() {
      const r = await fetch(`/classes/${this.classSlug}/short-rest`, { method: 'POST' });
      if (!r.ok) { this.flash((await r.json()).error || 'Short rest failed'); return; }
      this.session = await r.json();
      this.saveLocal();
    },

    async toggleAtHand(spell) {
      if (this.isAtHand(spell)) {
        const r = await fetch(`/classes/${this.classSlug}/at-hand/${spell.slug}`, { method: 'DELETE' });
        if (r.ok) { this.session = await r.json(); this.saveLocal(); }
      } else {
        const r = await fetch(`/classes/${this.classSlug}/at-hand`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spell_slug: spell.slug }),
        });
        if (r.ok) { this.session = await r.json(); this.saveLocal(); }
      }
    },
    async clearAtHand() {
      const r = await fetch(`/classes/${this.classSlug}/at-hand/clear`, { method: 'POST' });
      if (r.ok) { this.session = await r.json(); this.saveLocal(); }
    },

    isAtHand(spell) {
      return this.session.at_hand.includes(spell.slug);
    },
    canCast(level) {
      if (level < 1 || level > 9) return false;
      return this.session.slots_remaining[level - 1] > 0;
    },
    toggleExpand(spell) {
      this.expanded = { ...this.expanded, [spell.slug]: !this.expanded[spell.slug] };
    },

    flash(msg) {
      this.toast = msg;
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => { this.toast = ''; }, 3000);
    },

    /** Slot columns to show — only spell levels where max > 0. */
    get activeSlots() {
      return this.session.max_slots
        .map((max, i) => ({ spellLevel: i + 1, max, remaining: this.session.slots_remaining[i] }))
        .filter(col => col.max > 0);
    },

    get filteredSpells() {
      const pool = this.tab === 'at-hand'
        ? this.classSpells.filter(s => this.session.at_hand.includes(s.slug))
        : this.classSpells;

      const q = this.search.trim().toLowerCase();
      const lvl = this.levelFilter === '' ? null : parseInt(this.levelFilter, 10);

      return pool.filter(s => {
        if (lvl !== null && s.level !== lvl) return false;
        if (q && !s.name.toLowerCase().includes(q)) return false;
        return true;
      });
    },

    // Mirror session into localStorage and replay on load — server actor is in-memory only.
    storageKey() { return `cantrip.session.${this.classSlug}`; },
    storageGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    },
    storageSet(key, value) {
      try { localStorage.setItem(key, value); } catch {}
    },
    saveLocal() {
      if (!this.classSlug) return;
      this.storageSet(this.storageKey(), JSON.stringify(this.session));
    },
    loadLocal() {
      const raw = this.storageGet(this.storageKey());
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    },

    async rehydrate() {
      if (this.session.level !== null) return;
      const saved = this.loadLocal();
      if (!saved || saved.level == null) return;

      const r = await fetch(`/classes/${this.classSlug}/session`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ level: saved.level }),
      });
      if (!r.ok) return;
      this.session = await r.json();

      for (let i = 0; i < 9; i++) {
        const consumed = (saved.max_slots?.[i] ?? 0) - (saved.slots_remaining?.[i] ?? 0);
        for (let n = 0; n < consumed; n++) {
          const cr = await fetch(`/classes/${this.classSlug}/cast`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ spell_level: i + 1 }),
          });
          if (cr.ok) this.session = await cr.json();
        }
      }

      for (const slug of saved.at_hand || []) {
        const hr = await fetch(`/classes/${this.classSlug}/at-hand`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spell_slug: slug }),
        });
        if (hr.ok) this.session = await hr.json();
      }

      this.saveLocal();
    },
  };
}
</script>
