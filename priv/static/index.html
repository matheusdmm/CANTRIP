<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7c3aed">
    <meta name="color-scheme" content="light dark">
    <title>CANTRIP — Preparador de magias do 5.5e</title>
    <meta name="description" content="Acompanhe slots de magia e magias 'em mãos' para D&D 5.5e.">
    <meta name="author" content="Matheus (matheusdmm.dev)">

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%237c3aed%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27central%27%20font-family%3D%27system-ui%2CArial%27%20font-size%3D%2720%27%20font-weight%3D%27700%27%20fill%3D%27%23ffffff%27%3EC%3C%2Ftext%3E%3C%2Fsvg%3E">
    <link rel="apple-touch-icon"
        href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%237c3aed%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27central%27%20font-family%3D%27system-ui%2CArial%27%20font-size%3D%2720%27%20font-weight%3D%27700%27%20fill%3D%27%23ffffff%27%3EC%3C%2Ftext%3E%3C%2Fsvg%3E">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Cantrip">
    <meta property="og:title" content="Cantrip — Preparador de magias do 5.5e">
    <meta property="og:description" content="Acompanhe slots de magia e magias 'em mãos' para D&D 5.5e.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Cantrip — Preparador de magias do 5.5e">
    <meta name="twitter:description" content="Acompanhe slots de magia e magias 'em mãos' para D&D 5.5e.">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="/style.css">

    <script>
        (function () {
            var t = localStorage.getItem('cantrip.theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <script src="/app.js"></script>
</head>

<body>
    <div class="app" x-data="app()" x-init="init()" x-cloak>

        <!-- Sticky top: class selector + level + slots -->
        <div class="sticky">
            <h1>
                CANTRIP
                <button class="theme-toggle" @click="toggleTheme()"
                    :title="theme === 'dark' ? 'Tema claro' : 'Tema escuro'">
                    <template x-if="theme === 'dark'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="5" />
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </svg>
                    </template>
                    <template x-if="theme !== 'dark'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    </template>
                </button>
            </h1>

            <div class="control-row">
                <div>
                    <label for="class">Classe</label>
                    <select id="class" x-model="classSlug" @change="onClassChange()">
                        <template x-for="c in classes" :key="c.slug">
                            <option :value="c.slug" x-text="c.name"></option>
                        </template>
                    </select>
                </div>
                <div x-show="classSlug !== 'todas'">
                    <label for="lvl">Level</label>
                    <select id="lvl-sel" class="level-select" x-model.number="levelInput" @change="setLevel()">
                        <template x-for="n in 20" :key="n">
                            <option :value="n" x-text="n"></option>
                        </template>
                    </select>
                    <input id="lvl" class="level-input" type="number" pattern="[0-9]*" min="1" max="20"
                        x-model.number="levelInput" @change="setLevel()" @keydown.enter.prevent="setLevel()">
                </div>
                <div class="rest-tablet" x-show="session.level !== null">
                    <button @click="startWithUndo('Descanso Longo...', () => longRest())">Descanso Longo</button>
                    <button @click="shortRest()" x-show="classSlug === 'bruxo'">Descanso Curto</button>
                </div>
            </div>

            <div class="rest-row" x-show="session.level !== null">
                <button @click="longRest()">Descanso Longo</button>
                <button @click="shortRest()" x-show="classSlug === 'bruxo'">Descanso Curto</button>
            </div>

            <div x-show="session.level !== null && activeSlots.length > 0"
                x-transition:enter="animate__animated animate__fadeInDown animate__faster">
                <div class="slots">
                    <template x-for="col in activeSlots" :key="col.spellLevel">
                        <div class="slot-col" :class="{
              'has-slots': col.remaining > 0,
              'spent': col.remaining === 0,
              'animate__animated': pulsedSlot === col.spellLevel || pulsedSlot === 'all',
              'animate__pulse': pulsedSlot === col.spellLevel || pulsedSlot === 'all'
            }" @click="col.remaining > 0 && cast(col.spellLevel)">
                            <span class="slot-label" x-text="'L' + col.spellLevel"></span>
                            <div class="slot-pips">
                                <template x-for="n in col.max" :key="n">
                                    <span class="pip" :class="{ spent: n > col.remaining }"></span>
                                </template>
                            </div>
                            <span class="slot-count">
                                <strong x-text="col.remaining"></strong>/<span x-text="col.max"></span>
                            </span>
                        </div>
                    </template>
                </div>
            </div>

            <div class="no-level" x-show="session.level === null && classSlug !== 'todas'"
                x-transition:enter="animate__animated animate__fadeIn animate__faster">
                Defina seu nível para ver os slots.
            </div>
            <div class="no-level" x-show="session.level !== null && activeSlots.length === 0"
                x-transition:enter="animate__animated animate__fadeIn animate__faster">
                Nenhum slot neste nível.
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab" :class="tab === 'all' ? 'active' : ''" @click="tab = 'all'">
                Spells <span class="count" x-text="'(' + classSpells.length + ')'"></span>
            </button>
            <button class="tab" x-show="classSlug !== 'todas'" :class="tab === 'at-hand' ? 'active' : ''"
                @click="tab = 'at-hand'">
                Spells Preparadas <span class="count" x-text="'(' + session.at_hand.length + ')'"></span>
            </button>
            <div class="tabs-actions" x-show="session.at_hand.length > 0"
                x-transition:enter="animate__animated animate__fadeIn animate__faster">
                <button class="ghost" @click="startWithUndo('Limpando...', () => clearAtHand())">Limpar</button>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <input type="search" placeholder="Procurar pelo nome…" x-model="search" autocomplete="off">
            <select x-model="levelFilter">
                <option value="">Todos os Niveis</option>
                <option value="0">Truques</option>
                <option value="1">1º</option>
                <option value="2">2º</option>
                <option value="3">3º</option>
                <option value="4">4º</option>
                <option value="5">5º</option>
                <option value="6">6º</option>
                <option value="7">7º</option>
                <option value="8">8º</option>
                <option value="9">9º</option>
            </select>
        </div>

        <!-- Spell list -->
        <div class="spell-list">
            <template x-for="spell in filteredSpells" :key="spell.slug">
                <div class="spell-card animate__animated animate__fadeIn" :data-spell="spell.slug"
                    :class="{ 'at-hand': isAtHand(spell), 'open': expanded[spell.slug] }">
                    <div class="spell-head" @click="toggleExpand(spell)">
                        <div class="spell-head-text">
                            <h3 class="spell-name" x-text="spell.name"></h3>
                            <div class="spell-badges">
                                <span class="badge level"
                                    x-text="spell.level === 0 ? 'Truque' : 'Nv ' + spell.level"></span>
                                <span class="badge" x-text="spell.school"></span>
                                <span class="badge" x-show="spell.ritual">Ritual</span>
                                <span class="badge" x-show="spell.concentration">Concentração</span>
                                <div class="spell-classes" x-show="classSlug === 'todas'">
                                    <template x-for="cls in spell.classes" :key="cls">
                                        <span class="badge class-badge" x-text="cls"></span>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <span class="chev"></span>
                    </div>

                    <div class="meta-rows">
                        <div class="meta">
                            <span class="meta-label">Tempo</span>
                            <span class="meta-value" x-text="spell.casting_time"></span>
                        </div>
                        <div class="meta">
                            <span class="meta-label">Alcance</span>
                            <span class="meta-value" x-text="spell.range"></span>
                        </div>
                        <div class="meta">
                            <span class="meta-label">Duração</span>
                            <span class="meta-value" x-text="spell.duration"></span>
                        </div>
                        <div class="meta wide">
                            <span class="meta-label">Componentes</span>
                            <span class="meta-value" x-text="spell.components"></span>
                        </div>
                    </div>

                    <div class="description" x-show="expanded[spell.slug]" x-text="spell.description"
                        x-transition:enter="animate__animated animate__fadeIn animate__faster"></div>

                    <div class="spell-actions">
                        <button class="bookmark" x-show="classSlug !== 'todas'" :class="{ on: isAtHand(spell) }"
                            @click.stop="toggleAtHand(spell)">
                            <span class="bookmark-dot"></span>
                            <span x-text="isAtHand(spell) ? 'Salvo' : 'Salvar'"></span>
                        </button>
                        <button class="primary" x-show="spell.level > 0 && classSlug !== 'todas'"
                            @click.stop="cast(spell.level)" :disabled="!canCast(spell.level)">
                            Castar L<span x-text="spell.level"></span>
                        </button>
                        <button class="ghost" @click.stop="shareSpell(spell)">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                style="vertical-align:-1px;margin-right:4px">
                                <circle cx="18" cy="5" r="3" />
                                <circle cx="6" cy="12" r="3" />
                                <circle cx="18" cy="19" r="3" />
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                            </svg>Compartilhar
                        </button>
                    </div>
                </div>
            </template>

            <div class="empty-state" x-show="filteredSpells.length === 0"
                x-transition:enter="animate__animated animate__fadeIn animate__faster">
                <strong x-text="tab === 'at-hand' ? 'Nada Salvo ainda' : 'Nenhuma magia encontrada'"></strong>
                <span
                    x-text="tab === 'at-hand' ? `Use o botão de 'Salvar' para adicionar algo aqui.` : 'Verifique o nome da spell e tente novamente.'"></span>
            </div>
        </div>

        <div class="loading-overlay" x-show="loading">
            <div class="loading-card">
                <span class="spinner"></span>
            </div>
        </div>

        <div class="toast" :class="{ 'toast-success': toastKind === 'success', 'toast-warning': toastKind === 'warning' }" x-show="toast"
            x-transition:enter="animate__animated animate__bounceInUp"
            x-transition:leave="animate__animated animate__fadeOutDown">
            <span x-text="toast"></span>
            <button x-show="undoPending" @click.stop="cancelUndo()" class="toast-undo">Desfazer</button>
        </div>

        <footer class="footer">
            CANTRIP · feito por
            <a href="https://matheusdmm.dev" target="_blank" rel="noopener noreferrer">matheusdmm.dev</a>
        </footer>
    </div>


</body>

</html>
